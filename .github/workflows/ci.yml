name: Frontend CI & CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/kiwi-frontend

            # Скидаємо локальні зміни, беремо останню версію dev
            git fetch origin dev
            git reset --hard origin/dev

            # Встановлюємо залежності та білдимо фронт.
            # set -e: якщо білд впаде, старий процес PM2 продовжує працювати.
            npm ci
            npm run build

            # Перезапуск без даунтайму, або перший старт, якщо процесу ще немає
            pm2 reload kiwi-frontend || pm2 start "npm run start" --name kiwi-frontend --cwd /var/www/kiwi-frontend

      # Telegram notifications
      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: '✅ Frontend build & deploy successful on branch ${{ github.ref }}!'

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: '⚠️ Frontend build or deploy failed on branch ${{ github.ref }}!'
